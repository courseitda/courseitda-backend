services:
  mysql:
    image: mysql:8.4.5
    container_name: courseitda-mysql
    ports:
      - "33069:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE_NAME}
      MYSQL_USER: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - courseitda-mysql-data:/var/lib/mysql
    networks:
      - courseitda-network
    restart: unless-stopped

volumes:
  courseitda-mysql-data:

networks:
  courseitda-network:
    external: true  # 기존에 생성된 네트워크 사용
