spring:
  application:
    name: courseitda

  config:
    activate:
      on-profile: default,local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true

# Spring Actuator 및 메트릭 설정
management:
  server:
    port: ${MANAGEMENT_PORT:8080}  # Actuator 전용 포트 (기본값: 8080, 분리 시 9090 권장)
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics  # 노출할 엔드포인트
    ip-filter:
      enabled: ${ACTUATOR_IP_FILTER_ENABLED:false}  # IP 필터 활성화 여부 (기본값: false)
      allowed-ips: ${ACTUATOR_ALLOWED_IPS:}  # 허용할 IP 목록 (쉼표 구분)
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}  # 헬스체크 세부정보 (기본값: never)
  metrics:
    tags:
      application: ${spring.application.name}  # 메트릭에 애플리케이션 이름 태그 추가
    # Spring Boot 3.x에서는 micrometer-registry-prometheus 의존성만 있으면 자동 활성화

security:
  jwt:
    access-token:
      secret-key: since-jjwt-api-0.11-secret-key-must-be-longer-than-32-bytes
      validity-in-milliseconds: 3600000 # 1 hour

kakao:
  api:
    key: ${KAKAO_API_KEY}

naver:
  api:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
