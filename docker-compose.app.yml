services:
  spring-app:
    build:
      context: .
      dockerfile: Dockerfile.local  # 로컬 전용 Dockerfile 사용 (dev와 분리)
    container_name: courseitda-spring-app
    ports:
      - "8080:8080"
    volumes:
      # 로컬 로그 디렉토리 마운트 (Promtail과 공유)
      - ./logs:/app/logs
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      MYSQL_USERNAME: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      DDL_AUTO: create
      KAKAO_API_KEY: ${KAKAO_API_KEY}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      SPRING_PROFILES_ACTIVE: local
      LOG_PATH: /app/logs  # logback이 사용할 로그 디렉토리 지정
    networks:
      - courseitda-network
    restart: unless-stopped
    # depends_on은 같은 compose 파일 내 서비스만 인식 가능
    # mysql은 docker-compose.db.yml에 정의되어 있으므로 실행 순서로 관리

  promtail:
    image: grafana/promtail:latest
    container_name: courseitda-promtail
    volumes:
      - ./logs:/var/log/app:ro  # Spring 애플리케이션 로그 디렉토리를 읽기 전용으로 마운트
      - ./courseitda-backend-config/dev/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml  # 기존 Promtail 설정 파일 재사용
    environment:
      LOKI_SERVER_IP: loki           # Loki 컨테이너 호스트명
      LOKI_SERVER_PORT: 3100         # Loki 포트
      SPRING_SERVER_IP: spring-app   # Spring 컨테이너 호스트명
    command: -config.file=/etc/promtail/promtail-config.yml -config.expand-env=true
    networks:
      - courseitda-network
    restart: unless-stopped
    # spring-app이 같은 파일에 있지만, 실행 순서는 수동으로 관리

networks:
  courseitda-network:
    external: true
